# Thunderbird Ablation Study Configuration
# Mirrors bgl_ablations.yaml / hdfs_ablations.yaml for the Thunderbird replication experiment
# Run via: python -m src.evaluation.run_experiments_v2 --config config/thunderbird_ablations.yaml
#
# NOTE: Large artifacts (parsed.jsonl, template_map.jsonl, occurrences.duckdb)
# are stored on D: drive due to their size (>=3 GB each) — C: drive space constraint.
# Small artifacts (embeddings, FAISS, BM25, results) remain in the project tree on C:.

run:
  name: thunderbird_ablations
  seed: 42
  output_dir: results/thunderbird_ablations
  top_k: 50
  local_only: true

data:
  templates_path: data/processed/thunderbird/templates.jsonl
  embeddings:
    manifest_path: data/processed/thunderbird/template_embeddings.jsonl/manifest.json
    shards_dir: data/processed/thunderbird/template_embeddings.jsonl
  occurrence_store:
    db_path: "D:/Paper/LAR-RAG/data/processed/thunderbird/occurrences.duckdb"
    table: occurrences

ground_truth:
  incidents_path: data/evaluation/thunderbird_ground_truth_incidents.jsonl
  qrels_path: data/evaluation/thunderbird_ground_truth_qrels.jsonl
  max_incidents: 200
  min_relevant: 3
  split:
    method: time
    train_frac: 0.8

retrieval:
  bm25:
    index_dir: data/processed/thunderbird/bm25_index
  faiss:
    index_path: data/index/thunderbird_faiss/index.faiss
    meta_path: data/index/thunderbird_faiss/meta.json
    template_ids_path: data/index/thunderbird_faiss/template_ids.npy

lar_rag:
  alpha: 1.0
  beta: 0.3
  gamma: 0.3
  time_kernel:
    kind: asymmetric_exp
    tau_before: 3600
    tau_after: 7200
  topo_kernel:
    kind: exp
    tau: 2.0
  stage1:
    mode: hybrid
    candidates: 1000

methods:
  bm25_baseline:
    enabled: true

  dense_baseline:
    enabled: true

  hybrid_baseline:
    enabled: true
    bm25_weight: 0.3
    dense_weight: 0.7
    stage1_k: 1000

  lar_rag_full:
    enabled: true
    use_temporal: true
    use_topology: true

  lar_rag_no_time:
    enabled: true
    use_temporal: false
    use_topology: true
    alpha: 1.0
    beta: 0.0
    gamma: 0.3

  lar_rag_no_topo:
    enabled: true
    use_temporal: true
    use_topology: false
    alpha: 1.0
    beta: 0.3
    gamma: 0.0

  lar_rag_temporal_only:
    enabled: true
    use_temporal: true
    use_topology: false
    alpha: 0.0
    beta: 1.0
    gamma: 0.0

  lar_rag_topology_only:
    enabled: true
    use_temporal: false
    use_topology: true
    alpha: 0.0
    beta: 0.0
    gamma: 1.0

evaluation:
  metrics:
    - recall@1
    - recall@5
    - recall@10
    - recall@20
    - mrr@10
    - ndcg@10
    - map

  output_dir: results/thunderbird_ablations
  save_per_query: true
  save_summary: true
  save_run_meta: true
